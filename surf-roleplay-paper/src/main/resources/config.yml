handshake:
  # Seconds the server waits for the client mod's hello before disconnecting the player.
  timeout-seconds: 10
  # Ids of client mods allowed in addition to Minecraft, Java, the Fabric loader, MixinExtras,
  # Fabric API, Fabric Language Kotlin and the roleplay mod.
  allowed-mods: []

screens:
  # The largest number of screen actions (clicks, typed screen actions) a player may send per second.
  max-actions-per-second: 20

tab-list:
  # The daily restart time in Europe/Berlin as HH:mm; empty if the server does not restart daily.
  restart-time: "05:00"
  # The announcement line shown to every player; empty for none.
  announcement: ""
  # Per organisation (civilian, police, sar): whether the exact online count is shown in addition
  # to the coarse level, and the two thresholds of the levels "wenige" and "viele".
  organisations:
    civilian:
      exact: false
      thresholds: [1, 3]
    police:
      exact: false
      thresholds: [1, 3]
    sar:
      exact: false
      thresholds: [1, 3]
