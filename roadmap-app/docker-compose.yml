# Local build and run. Set ROADMAP_TOKEN in the environment or in a .env file next to this file.
services:
  roadmap:
    build: .
    image: surf-roleplay-roadmap:local
    ports:
      - "3000:3000"
    environment:
      ROADMAP_TOKEN: ${ROADMAP_TOKEN:?Set ROADMAP_TOKEN}
    volumes:
      - roadmap-data:/app/data
    restart: unless-stopped

volumes:
  roadmap-data:
