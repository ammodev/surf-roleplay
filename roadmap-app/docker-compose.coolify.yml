# Deployment on Coolify from the GHCR image built by .github/workflows/roadmap-app-image.yml.
# In Coolify: New Resource -> Docker Compose -> paste this file, set ROADMAP_TOKEN in the
# environment variables, and assign a domain to the "roadmap" service (port 3000).
services:
  roadmap:
    image: ghcr.io/ammodev/surf-roleplay-roadmap:latest
    environment:
      - SERVICE_FQDN_ROADMAP_3000
      - ROADMAP_TOKEN=${ROADMAP_TOKEN:?Set ROADMAP_TOKEN}
      - COOKIE_SECURE=true
    volumes:
      - roadmap-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  roadmap-data:
