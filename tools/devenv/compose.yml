# Local dev stack of surf-roleplay. See README.md in this folder.
name: surf-roleplay-dev

# Connection settings shared by every surf plugin and microservice.
x-surf-env: &surf-env
  SURF_DATABASE_TYPE: postgresql
  SURF_DATABASE_HOST: postgres
  SURF_DATABASE_PORT: "5432"
  SURF_DATABASE_NAME: surf
  SURF_DATABASE_SCHEMA: public
  SURF_DATABASE_USERNAME: postgres
  SURF_DATABASE_PASSWORD: dev
  SURF_REDIS_HOST: redis
  SURF_REDIS_PORT: "6379"
  SURF_RABBITMQ_HOST: rabbitmq
  SURF_RABBITMQ_PORT: "5672"
  SURF_RABBITMQ_USERNAME: surf
  SURF_RABBITMQ_PASSWORD: dev
  # Docker's default seccomp profile blocks io_uring, so Netty must use NIO.
  JAVA_TOOL_OPTIONS: -Dio.netty.transport.noNative=true

# The Java services start after the infrastructure is healthy and the jars are fetched.
x-java-service: &java-service
  image: eclipse-temurin:25-jre
  environment: *surf-env
  stdin_open: true
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    fetch: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: surf
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d surf"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: surf
      RABBITMQ_DEFAULT_PASS: dev
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  fetch:
    image: curlimages/curl:8.16.0
    user: root
    env_file: versions.env
    entrypoint: ["sh", "/scripts/fetch.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./versions.env:/versions.env:ro
      - ./jars:/jars

  ms-core:
    <<: *java-service
    working_dir: /data
    command: ["java", "-Xmx512M", "-jar", "/jars/microservices/surf-core.jar"]
    volumes:
      - ./jars:/jars:ro
      - ./run/ms-core:/data

  ms-transaction:
    <<: *java-service
    working_dir: /data
    command: ["java", "-Xmx512M", "-jar", "/jars/microservices/surf-transaction.jar"]
    volumes:
      - ./jars:/jars:ro
      - ./run/ms-transaction:/data

  ms-roleplay:
    <<: *java-service
    working_dir: /data
    command: ["sh", "/scripts/run-build-jar.sh", "/build", "-Xmx512M"]
    volumes:
      - ./scripts:/scripts:ro
      - ../../surf-roleplay-microservice/build/libs:/build:ro
      - ./run/ms-roleplay:/data

  paper:
    <<: *java-service
    environment:
      <<: *surf-env
      JVM_ARGS: -Xmx2G
    depends_on:
      ms-core: { condition: service_started }
      ms-transaction: { condition: service_started }
      ms-roleplay: { condition: service_started }
    command: ["sh", "/scripts/start-server.sh", "paper", "--nogui"]
    volumes:
      - ./scripts:/scripts:ro
      - ./jars:/jars:ro
      - ./templates/paper:/templates:ro
      - ../../surf-roleplay-paper/build/libs:/build:ro
      - ./run/paper:/data

  velocity:
    <<: *java-service
    environment:
      <<: *surf-env
      JVM_ARGS: -Xmx512M
    depends_on:
      paper: { condition: service_started }
    command: ["sh", "/scripts/start-server.sh", "velocity"]
    ports: ["25565:25565"]
    volumes:
      - ./scripts:/scripts:ro
      - ./jars:/jars:ro
      - ./templates/velocity:/templates:ro
      - ../../surf-roleplay-velocity/build/libs:/build:ro
      - ./run/velocity:/data

volumes:
  postgres-data:
